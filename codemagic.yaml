workflows:
  android-release:
    name: Volta APK
    max_build_duration: 60
    environment:
      flutter: 3.22.2
      java: 17
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Generate launcher icons
        script: dart run flutter_launcher_icons || flutter pub run flutter_launcher_icons:main || true
      - name: Analyze (non-blocking)
        script: flutter analyze || true
      - name: Build APK (release, unsigned debug-signed)
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/**/mapping.txt
